name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `next typegen` must run before tsc — Next 16 generates global types
      # (LayoutProps, PageProps) into .next/types that the app code depends on.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only deploy green commits on main. Komodo builds the image on the VPS itself,
    # so there is nothing to push here — we just tell it to redeploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, docker]
    environment: production
    steps:
      - name: Trigger Komodo deploy
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ secrets.KOMODO_STACK }}
        run: |
          if [ -z "$KOMODO_URL" ]; then
            echo "::notice::Komodo secrets not configured — skipping deploy. See docs/04-deploy.md"
            exit 0
          fi
          echo "Deploying stack '$KOMODO_STACK' via $KOMODO_URL"
          code=$(curl -sS --retry 2 --retry-delay 5 --max-time 300 \
            -o /tmp/komodo.json -w '%{http_code}' \
            -X POST "${KOMODO_URL%/}/execute" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$KOMODO_STACK\"}}")
          echo "HTTP $code"
          cat /tmp/komodo.json || true
          echo
          if [ "$code" -ge 300 ]; then
            echo "::error::Komodo deploy failed with HTTP $code"
            exit 1
          fi

  smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for the site to come back healthy
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL not set — skipping smoke test."
            exit 0
          fi
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${SITE_URL%/}/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s)"; cat /tmp/health.json; exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "::error::Site did not become healthy within 5 minutes"
          exit 1

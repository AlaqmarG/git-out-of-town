name: CI

# Positive path filters: this pipeline builds and deploys the web app, so it only
# runs when something that can change the deployed artifact changes. Docs, markdown
# and the iOS app never trigger a rebuild or a deploy.
# Negations (`!`) exclude markdown living inside otherwise-relevant directories.
#
# NOTE: the path lists are duplicated on purpose — GitHub Actions does not support
# YAML anchors/aliases, and using them silently stops the workflow from running.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "db/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "db/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `next typegen` runs inside the web workspace's typecheck script — Next 16
      # generates global types (LayoutProps, PageProps) that app code depends on.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only deploy green commits on main. Komodo builds the image on the VPS itself,
    # so there is nothing to push here — we just tell it to redeploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, docker]
    environment: production
    outputs:
      before: ${{ steps.before.outputs.build }}
    steps:
      - name: Record the build that is live now
        id: before
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          before=$(curl -sS --max-time 20 "${SITE_URL%/}/api/health" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || echo "")
          echo "build=$before" >> "$GITHUB_OUTPUT"
          echo "currently live: ${before:-unknown}"

      - name: Sync REPLICATE_API_TOKEN into the Komodo stack env
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ secrets.KOMODO_STACK }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -z "$KOMODO_URL" ] || [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "::notice::Komodo or Replicate secret not set — skipping env sync."
            exit 0
          fi
          # Read the stack's current environment. Every failure path here warns
          # and moves on — a botched sync must never block or corrupt a deploy.
          if ! curl -sS --max-time 60 -o /tmp/stack.json \
            -X POST "${KOMODO_URL%/}/read" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"type\":\"GetStack\",\"params\":{\"stack\":\"$KOMODO_STACK\"}}"; then
            echo "::warning::GetStack failed — skipping env sync."; exit 0
          fi
          envstr=$(jq -r 'if (.config.environment|type) == "string" then .config.environment else "" end' /tmp/stack.json)
          if [ -z "$envstr" ]; then
            echo "::warning::Stack environment missing or not a string — skipping env sync."; exit 0
          fi
          if printf '%s\n' "$envstr" | grep -qxF "REPLICATE_API_TOKEN=$REPLICATE_API_TOKEN"; then
            echo "Token already in sync."; exit 0
          fi
          merged=$(printf '%s\n' "$envstr" | grep -v '^REPLICATE_API_TOKEN=' ; printf 'REPLICATE_API_TOKEN=%s\n' "$REPLICATE_API_TOKEN")
          body=$(jq -n --arg stack "$KOMODO_STACK" --arg env "$merged" \
            '{type:"UpdateStack",params:{id:$stack,config:{environment:$env}}}')
          code=$(curl -sS --max-time 60 -o /tmp/update.json -w '%{http_code}' \
            -X POST "${KOMODO_URL%/}/write" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::warning::UpdateStack returned HTTP $code — env not synced (deploy continues)."
            cat /tmp/update.json || true
          else
            echo "Stack env updated with REPLICATE_API_TOKEN."
          fi

      - name: Trigger Komodo deploy
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ secrets.KOMODO_STACK }}
        run: |
          if [ -z "$KOMODO_URL" ] || [ -z "$KOMODO_API_KEY" ]; then
            echo "::notice::Komodo secrets not configured — skipping deploy. See docs/04-deploy.md"
            exit 0
          fi
          echo "Deploying stack '$KOMODO_STACK' via $KOMODO_URL"
          code=$(curl -sS --retry 2 --retry-delay 5 --max-time 300 \
            -o /tmp/komodo.json -w '%{http_code}' \
            -X POST "${KOMODO_URL%/}/execute" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$KOMODO_STACK\"}}")
          echo "HTTP $code"; cat /tmp/komodo.json || true; echo
          if [ "$code" -ge 300 ]; then
            echo "::error::Komodo deploy failed with HTTP $code"; exit 1
          fi

  smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the NEW build to be serving
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          BEFORE: ${{ needs.deploy.outputs.before }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL not set — skipping smoke test."; exit 0
          fi
          # Waiting for HTTP 200 is NOT enough: the old container answers 200 the
          # entire time Komodo rebuilds, so the suite would test the previous
          # release. That is exactly how /data and /api/stats 404'd here once.
          # Wait for Next's BUILD_ID to actually change.
          for i in $(seq 1 40); do
            now=$(curl -sS --max-time 20 "${SITE_URL%/}/api/health" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || echo "")
            if [ -n "$now" ] && [ "$now" != "$BEFORE" ]; then
              echo "new build live: $now (was ${BEFORE:-unknown})"; exit 0
            fi
            echo "attempt $i: still ${now:-no-response} — waiting 10s"; sleep 10
          done
          echo "::error::New build never appeared — smoke would have tested the previous release"
          exit 1
      - name: Functional smoke test
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL not set — skipping."; exit 0
          fi
          # Read-only: no admin delete endpoint yet (#17), so CI must not write.
          npm run test:smoke

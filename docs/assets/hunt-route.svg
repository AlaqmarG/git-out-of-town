<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="Animated route map of the photo run across downtown west Toronto">
  <style>
    .bg    { fill: #0F1117; }
    .card  { fill: #10151F; stroke: #232A3A; stroke-width: 1; }
    .h1    { fill: #E6EDF3; font: 700 20px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h2    { fill: #8B949E; font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .st    { stroke: #1C2436; stroke-width: 1.5; }
    .stl   { fill: #3D4757; font: 500 9.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lbl   { fill: #C9D1D9; font: 600 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lbld  { fill: #6E7681; font: 600 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tm    { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .leg   { fill: #56606E; font: 500 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .foot  { fill: #6E7681; font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }

    .grid  { opacity: 0; animation: fade 0.9s ease-out 0.15s forwards; }
    @keyframes fade { to { opacity: 1; } }

    .done  { stroke-dasharray: 570; stroke-dashoffset: 570; animation: draw 1.1s ease-out 0.6s forwards; }
    .todo  { stroke-dasharray: 1140; stroke-dashoffset: 1140; animation: draw 3.4s ease-in-out 1.5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pin   { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.2,1.5,.4,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.1); } to { opacity: 1; transform: scale(1); } }

    .tag   { opacity: 0; animation: fade 0.5s ease-out forwards; }

    .halo  { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out 2s infinite; }
    @keyframes ping { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(3.2); opacity: 0; } }

    .p0{animation-delay:.8s}  .p1{animation-delay:1.0s} .p2{animation-delay:1.2s}
    .p3{animation-delay:2.0s} .p4{animation-delay:2.4s} .p5{animation-delay:2.8s}
    .p6{animation-delay:3.2s} .p7{animation-delay:3.6s} .p8{animation-delay:4.0s}
  </style>

  <rect class="bg" width="880" height="620" rx="14"/>
  <rect class="card" x="16" y="16" width="848" height="588" rx="12"/>

  <text class="h1" x="44" y="54">The ride — Bike Share, 33 min left in the saddle</text>
  <text class="h2" x="44" y="75">Downtown west · 5 banked, 4 to go · every leg under 12 min · the rest of each hour is build time</text>

  <g class="grid">
    <line class="st" x1="90" y1="135" x2="770" y2="135"/><text class="stl" x="766" y="130" text-anchor="end">COLLEGE ST</text>
    <line class="st" x1="90" y1="225" x2="770" y2="225"/><text class="stl" x="766" y="220" text-anchor="end">DUNDAS ST W</text>
    <line class="st" x1="90" y1="337" x2="770" y2="337"/><text class="stl" x="766" y="330" text-anchor="end">QUEEN ST W</text>
    <line class="st" x1="90" y1="372" x2="770" y2="372"/><text class="stl" x="766" y="367" text-anchor="end">KING ST W</text>
    <line class="st" x1="90" y1="413" x2="770" y2="413"/><text class="stl" x="766" y="408" text-anchor="end">FRONT ST W</text>
    <line class="st" x1="286" y1="110" x2="286" y2="500"/><text class="stl" x="290" y="122">BATHURST</text>
    <line class="st" x1="498" y1="110" x2="498" y2="500"/><text class="stl" x="502" y="122">SPADINA</text>
    <path d="M90,516 Q200,508 310,516 T530,516 T750,516 L770,516 L770,570 L90,570 Z" fill="#0C1A24" stroke="#152A38" stroke-width="1"/>
    <text class="stl" x="404" y="547" fill="#2E4656">LAKE ONTARIO</text>
  </g>

  <path class="done" d="M256,467 L407,377 L392,307 L286,243 L438,135" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <path id="route" class="todo" d="M438,135 L332,485 L196,341 L498,225 L710,341"
        fill="none" stroke="#F0A020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <circle r="5.5" fill="#FFD98A" opacity="0.95">
    <animateMotion dur="7s" begin="4.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>

  <g class="pin p0"><circle cx="256" cy="467" r="7" fill="#3FB950" opacity="0.75"/><path d="M252.7 467 l2.5 2.6 l4.5 -4.9" fill="none" stroke="#0F1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="tag lbld p0" x="242" y="471" text-anchor="end"><tspan class="tm" fill="#3FB950">11:17</tspan> Milky's</text>

  <g class="pin p1"><circle cx="407" cy="377" r="7" fill="#3FB950" opacity="0.75"/><path d="M403.7 377 l2.5 2.6 l4.5 -4.9" fill="none" stroke="#0F1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="tag lbld p1" x="421" y="381"><tspan class="tm" fill="#3FB950">12:21</tspan> Fungo Cafe</text>

  <g class="pin p2"><circle cx="392" cy="307" r="7" fill="#3FB950" opacity="0.75"/><path d="M388.7 307 l2.5 2.6 l4.5 -4.9" fill="none" stroke="#0F1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="tag lbld p2" x="406" y="300"><tspan class="tm" fill="#3FB950">1:24</tspan> Waterworks / The Well</text>

  <g class="pin p3"><circle cx="286" cy="243" r="7" fill="#3FB950" opacity="0.75"/><path d="M282.7 243 l2.5 2.6 l4.5 -4.9" fill="none" stroke="#0F1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="tag lbld p3" x="272" y="239" text-anchor="end"><tspan class="tm" fill="#3FB950">2:25</tspan> Scadding Court</text>

  <g class="pin p4"><circle cx="438" cy="135" r="7" fill="#3FB950" opacity="0.75"/><path d="M434.7 135 l2.5 2.6 l4.5 -4.9" fill="none" stroke="#0F1117" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="tag lbld p4" x="452" y="139"><tspan class="tm" fill="#3FB950">3:26</tspan> TPL Lillian H. Smith</text>

  <g class="pin p5">
    <circle class="halo" cx="332" cy="485" r="8" fill="none" stroke="#F0A020" stroke-width="2"/>
    <circle cx="332" cy="485" r="8" fill="#F0A020"/><circle cx="332" cy="485" r="3" fill="#0F1117"/>
  </g>
  <text class="tag lbl p5" x="346" y="489"><tspan class="tm" fill="#F0A020">4:26</tspan> TPL Fort York</text>

  <g class="pin p6"><circle cx="196" cy="341" r="7" fill="#10151F" stroke="#A371F7" stroke-width="2.5"/></g>
  <text class="tag lbl p6" x="182" y="338" text-anchor="end"><tspan class="tm" fill="#A371F7">5:26</tspan> Botanic</text>

  <g class="pin p7"><circle cx="498" cy="225" r="7" fill="#10151F" stroke="#A371F7" stroke-width="2.5"/></g>
  <text class="tag lbl p7" x="512" y="221"><tspan class="tm" fill="#A371F7">6:26</tspan> ICHA Tea · Chinatown</text>

  <g class="pin p8"><circle cx="710" cy="341" r="7" fill="#10151F" stroke="#A371F7" stroke-width="2.5"/></g>
  <text class="tag lbl p8" x="696" y="345" text-anchor="end"><tspan class="tm" fill="#A371F7">7:26</tspan> Varda</text>

  <text class="foot" x="44" y="589">Green = banked · amber = next up, last free stop before the 5 PM wall · purple = café, recoverable Sunday morning</text>
</svg>
